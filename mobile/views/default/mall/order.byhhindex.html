    //监听头工具栏事件
    table.on('toolbar(tablegrid)', function (obj) {
      var checkStatus = table.checkStatus(obj.config.id);
      var items = new Array();
	  console.log(checkStatus.data);
      $.each(checkStatus.data, function (i, item) {
        items.push(item.order_id);
      });

      if (obj.event === 'export') {
		  if (checkStatus.data.length <= 0) {
		    //return alert("请选择要导出的数据^_^");
			$('.downChoose').val('all');
			window.location.href = url(['orderbyhh/export', $.extend($("#formSearch").serializeJson(), { id: items.join(',') })]);
		  }else{
			  $('.downChoose').val('select');
			 window.location.href = url(['orderbyhh/export', $.extend($("#formSearch").serializeJson(), { id: items.join(',') })]);
		  }
		}else if(obj.event === 'printeds'){
			window.open(url(['order_printed/view', $.extend($("#formSearch").serializeJson(), { order_ids: items.join(',') ,ptf:115})]));
		}else if(obj.event === 'address-list'){
		  //window.open(url(['order_printed/addresss', $.extend($("#formSearch").serializeJson(), { id: items.join(',') })]));

		}
    });

    //监听行工具事件
    table.on('tool(tablegrid)', function (obj) {
		var data = obj.data;
		if(obj.event === 'open_printed'){
			window.open(url(['order_printed/lists', { order_id: data.order_id ,cate_id:22}]));
		}else if(obj.event === 'other_printed'){
			window.open(url(['order_printed/lists', { order_id: data.order_id,cate_id:21 }]));
		}else if(obj.event === 'goodsPay'){
			//window.open(url(['cashier/index', { order_id: data.order_id }]));
			//return console.log(url(['cashier/index', { order_id: data.order_id ,'from':'orderbyhh'}]));
			location.href = url(['cashier/index', { order_id: data.order_id ,'from':'orderbyhh'}]);
		}else if(obj.event === 'goodsView'){
			//window.open(url(['goods/index', { id: data.goods_id }]));
			window.location.href=url(['goods/index', { id: data.goods_id }]);
		}else if(obj.event === 'goodsClass'){

		}else if(obj.event === 'view'){
			window.open(url(['buyer_order/view', { order_id: data.order_id }]));
		}else if(obj.event === 'viewContent'){

		}else if(obj.event === 'del'){

		}
